<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Panel de gestión de farmacias: inventario, punto de venta, transferencias entre sucursales y reportes en tiempo real." />
  <meta name="theme-color" content="#00c7be" />
  <title>Sistema de Farmacia</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2300c7be'/><rect x='13' y='6' width='6' height='20' rx='3' fill='white'/><rect x='6' y='13' width='20' height='6' rx='3' fill='white'/></svg>" />

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
</head>
<body>

  <!-- Topbar móvil (hamburguesa) — solo visible en pantallas pequeñas -->
  <header id="mobile-topbar" style="display:none;">
    <button id="hamburger-btn" aria-label="Abrir menú">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" x2="20" y1="6" y2="6"/>
        <line x1="4" x2="20" y1="12" y2="12"/>
        <line x1="4" x2="20" y1="18" y2="18"/>
      </svg>
    </button>
    <div style="display:flex; align-items:center; gap:0.5rem;">
      <div style="width:1.75rem; height:1.75rem; border-radius:0.4rem;
                  background:linear-gradient(135deg,#5fe0dd,#00c7be);
                  display:flex; align-items:center; justify-content:center;">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
             fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
        </svg>
      </div>
      <span style="font-weight:700; font-size:0.9375rem; color:#1c1c1e;">Farmacia</span>
    </div>
    <div style="width:2.5rem;"></div><!-- espaciador para centrar el logo -->
  </header>

  <!-- Overlay oscuro para cerrar sidebar en móvil -->
  <div id="sidebar-overlay"></div>

  <!-- SPA root -->
  <div id="app">
    <nav id="sidebar" style="display:none;"></nav>
    <main id="content">
      <div class="page-spinner">
        <span class="spinner spinner-lg"></span>
        <p>Cargando sistema...</p>
      </div>
    </main>
  </div>

  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/sidebar.js"></script>
  <script type="module" src="js/router.js"></script>

  <!-- Hamburguesa: abre sidebar -->
  <script type="module">
    import { openMobileSidebar } from './js/sidebar.js';
    document.getElementById('hamburger-btn')?.addEventListener('click', openMobileSidebar);
    document.getElementById('sidebar-overlay')?.addEventListener('click', () => {
      import('./js/sidebar.js').then(m => m.closeMobileSidebar());
    });
  </script>

</body>
</html>
